# Nav2-Konfiguration (ROS 2 Jazzy) für den Ackermann-Rover.
#
# Basis: nav2_bringup/params/nav2_params.yaml. Wichtigste Änderungen:
#  - Planer: Smac Hybrid-A* mit Reeds-Shepp-Bewegungsmodell und minimalem
#    Wendekreisradius → kinematisch fahrbare Pfade inkl. Rangieren rückwärts.
#  - Regler: Regulated Pure Pursuit ohne "rotate to heading", mit Rückwärtsfahrt.
#  - Rechteckiger Footprint statt Kreis, Frames auf base_footprint.
#  - Behavior Trees ohne Spin-Recovery (Pfade setzt navigation.launch.py).
#
# Rover: Radstand 0,56 m, max. Lenkwinkel 0,7 rad → R_min ≈ 0,87 m.
# base_footprint = Mitte der Hinterachse (Fahrzeugmitte liegt 0,28 m davor).
# Zwei Lidare: /scan (vorne) und /scan_rear (hinten) für die Costmaps;
# AMCL und slam_toolbox nutzen den zusammengeführten 360°-Scan /scan_merged.

amcl:
  ros__parameters:
    # Rad-Odometrie des Ackermann-Plugins driftet ~5–10 % → moderates Rauschen
    alpha1: 0.25
    alpha2: 0.25
    alpha3: 0.25
    alpha4: 0.25
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 120
    max_particles: 1000
    min_particles: 300
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    # Sim-Lidar ist präzise (σ = 1 cm) → schärferes Sensormodell
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.8
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05
    scan_topic: scan_merged
    # Startpose des Rovers in der Welt (siehe tools/office_template.sdf)
    set_initial_pose: true
    initial_pose:
      x: 1.28
      y: -2.5
      z: 0.0
      yaw: 3.14159

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Werden von navigation.launch.py auf ros/behavior_trees/*.xml gesetzt:
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
    # Ein Ackermann-Fahrzeug kann die Ausrichtung am Ziel nicht auf der Stelle
    # korrigieren – daher großzügige Winkeltoleranz.
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.6
    # Regulated Pure Pursuit: folgt dem kinematisch gültigen Hybrid-A*-Pfad
    # (Krümmung ≤ 1/R_min), fährt Rückwärts-Abschnitte rückwärts und dreht nie
    # auf der Stelle. (MPPI mit Ackermann-Modell wurde getestet, pendelte in
    # den engen Räumen aber vor und zurück.)
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4
      # kurzer Lookahead: folgt dem Pfad eng und schneidet keine Türecken
      lookahead_dist: 0.5
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.7
      lookahead_time: 1.0
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.8
      # Nur unmittelbar bevorstehende Kollisionen prüfen: RPP projiziert eine
      # Kreisbahn konstanter Krümmung, die beim Ackermann-Rover vom
      # (footprint-geprüften) Hybrid-A*-Pfad abweicht und sonst Fehlalarme an
      # Hindernissen neben dem Pfad auslöst. Sicherheit: collision_monitor.
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.5
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.25
      # Ackermann: niemals auf der Stelle drehen, dafür rückwärts rangieren
      use_rotate_to_heading: false
      allow_reversing: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 6.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.84, 0.38], [0.84, -0.38], [-0.17, -0.38], [-0.17, 0.38]]"
      footprint_padding: 0.02
      # Statische Karte + beide Lidare. Die Karte ist nötig, weil die Lidare
      # (0,27 m hoch) Tischplatten nicht sehen – ohne sie fährt der Rover
      # unter den Couchtisch oder an Schreibtischkanten. Voraussetzung ist
      # eine gute Lokalisierung (360°-Scan, AMCL-Fehler ≈ 2–10 cm).
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: scan scan_rear
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
        scan_rear:
          topic: /scan_rear
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.95
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[0.84, 0.38], [0.84, -0.38], [-0.17, -0.38], [-0.17, 0.38]]"
      # 10 cm Reserve für Spurfehler: die Front schwenkt in Kurven aus
      footprint_padding: 0.10
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan scan_rear
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
        scan_rear:
          topic: /scan_rear
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      # Smac Hybrid-A* braucht inflation_radius >= Umkreisradius des
      # Footprints um base_footprint inkl. Polster (≈ 1,06 m), sonst wird die
      # Kollisionsprüfung sehr langsam. Flacher Abfall: Pfade halten Abstand
      # zu Wänden, weil die Front des Rovers in Kurven ausschwenkt.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.1
      always_send_full_costmap: True

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      # REEDS_SHEPP erlaubt Rückwärtsfahrt (Rangieren), DUBIN nur vorwärts
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      # etwas größer als der physikalische Minimalradius (≈ 0,87 m)
      minimum_turning_radius: 0.95
      # moderat: lieber ein Stück weiter zurücksetzen als knapp an Wänden wenden
      reverse_penalty: 1.5
      change_penalty: 0.2
      non_straight_penalty: 1.2
      cost_penalty: 5.0
      retrospective_penalty: 0.015
      lookup_table_size: 10.0  # m; größer = langsamerer Start (Reeds-Shepp-Tabelle)
      cache_obstacle_heuristic: true
      debug_visualizations: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# scale_velocities: True hält das Verhältnis linear/angular (= Krümmung) fest,
# wenn eine Grenze greift – sonst würde der Lenkwinkel verfälscht.
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: True
    feedback: "OPEN_LOOP"
    max_velocity: [0.7, 0.0, 1.5]
    min_velocity: [-0.6, 0.0, -1.5]
    max_accel: [1.0, 0.0, 2.5]
    max_decel: [-1.5, 0.0, -2.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 2.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan", "scan_rear"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True
    scan_rear:
      type: "scan"
      topic: "scan_rear"
      min_height: 0.15
      max_height: 2.0
      enabled: True

# Nur für slam:=True (slam_toolbox, online async)
slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan_merged
    mode: mapping
    resolution: 0.05
    max_laser_range: 12.0
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    map_update_interval: 2.0
    transform_publish_period: 0.02
    use_scan_matching: true
    do_loop_closing: true
